<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DRCHAT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eee}
.app{max-width:500px;margin:auto;height:100vh;background:#fff;display:flex;flex-direction:column}
.header{background:#075e54;color:white;padding:15px;display:flex;justify-content:space-between}
.logo{font-size:24px;font-weight:bold}
.screen{flex:1;overflow:auto}
.box{padding:18px}
input{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{padding:12px 18px;border:0;border-radius:8px;background:#075e54;color:white;font-size:15px;margin:5px 2px}
button.red{background:#c62828}
.user{padding:12px;border-bottom:1px solid #ddd;cursor:pointer}
.user:hover{background:#f5f5f5}
.chatHeader{background:#075e54;color:white;padding:13px;display:flex;align-items:center}
.back{font-size:25px;margin-right:15px}
.messages{flex:1;padding:12px;overflow:auto;background:#efeae2}
.chatScreen{display:none;flex-direction:column;height:100%}
.msg{max-width:75%;padding:9px 12px;margin:6px 0;border-radius:10px;word-wrap:break-word}
.sent{background:#d9fdd3;margin-left:auto}
.received{background:white;margin-right:auto}
.messageBox{display:flex;padding:7px;background:#eee}
.messageBox input{margin:0;flex:1;border-radius:25px}
.send{width:50px;border-radius:50%;margin-left:6px}
.small{color:#777;font-size:13px;margin:5px 0}
.hidden{display:none}
</style>
</head>

<body>

<div class="app">

<!-- LOGIN -->
<div id="loginScreen" class="screen">
<div class="header">
<div class="logo">DRCHAT</div>
</div>

<div class="box">
<h2>DRCHAT Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>

<p id="loginMsg" class="small"></p>
</div>
</div>


<!-- HOME -->
<div id="homeScreen" class="screen hidden">

<div class="header">
<div class="logo">DRCHAT</div>
<button onclick="logout()">Logout</button>
</div>

<div class="box">
<h3 id="myName">DRCHAT</h3>
<p class="small">Username se user search karo</p>

<input id="searchUser" placeholder="Username likho">
<button onclick="searchUser()">Search</button>

<div id="searchResult"></div>
</div>

</div>


<!-- CHAT -->
<div id="chatScreen" class="chatScreen">

<div class="chatHeader">
<div class="back" onclick="closeChat()">←</div>
<div id="chatUser">Chat</div>
</div>

<div id="messages" class="messages"></div>

<div class="messageBox">
<input id="messageInput"
placeholder="Message likho..."
onkeydown="enterSend(event)">
<button class="send" onclick="sendMessage()">➤</button>
</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
query,
where,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
apiKey:"AIzaSyAckXOKvjKJi_Idim6Xja29h-WMpjdTXHs",
authDomain:"drchat-5cfbf.firebaseapp.com",
projectId:"drchat-5cfbf",
storageBucket:"drchat-5cfbf.firebasestorage.app",
messagingSenderId:"905952296260",
appId:"1:905952296260:web:0cf8eed8be7284f0d76b11",
measurementId:"G-9J7ZPXXBWS"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentChatUser = null;
let unsubscribeMessages = null;


/* SIGN UP */

window.signup = async function(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(!email || !password){
alert("Email aur password bharo");
return;
}

if(password.length < 6){
alert("Password kam se kam 6 characters ka hona chahiye");
return;
}

try{

const result =
await createUserWithEmailAndPassword(auth,email,password);

const username =
prompt("Apna unique username likho:");

if(!username){
alert("Username zaroor banana hai");
return;
}

const cleanUsername =
username.trim().toLowerCase();

await setDoc(
doc(db,"users",result.user.uid),
{
uid:result.user.uid,
email:email,
username:cleanUsername,
createdAt:serverTimestamp()
}
);

alert("Account ban gaya!");

}catch(error){

alert(error.message);

}

};


/* LOGIN */

window.login = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,email,password
);

}catch(error){

alert(error.message);

}

};


/* LOGOUT */

window.logout = async function(){

await signOut(auth);

};


/* AUTH CHECK */

onAuthStateChanged(auth,async(user)=>{

if(user){

currentUser=user;

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("homeScreen")
.classList.remove("hidden");

const snap =
await getDoc(doc(db,"users",user.uid));

if(snap.exists()){

document.getElementById("myName").innerText =
"👤 " + snap.data().username;

}

}else{

currentUser=null;

document.getElementById("loginScreen")
.classList.remove("hidden");

document.getElementById("homeScreen")
.classList.add("hidden");

}

});


/* SEARCH USER */

window.searchUser = async function(){

const username =
document.getElementById("searchUser")
.value.trim().toLowerCase();

if(!username){
alert("Username likho");
return;
}

const q =
query(
collection(db,"users"),
where("username","==",username)
);

const snap = await getDocsSafe(q);

const result =
document.getElementById("searchResult");

result.innerHTML="";

if(snap.empty){

result.innerHTML =
"<p class='small'>User nahi mila.</p>";

return;

}

snap.forEach((d)=>{

const data=d.data();

if(data.uid === currentUser.uid){
result.innerHTML =
"<p class='small'>Ye aapka khud ka username hai.</p>";
return;
}

const div=document.createElement("div");

div.className="user";

div.innerHTML=
"<b>👤 "+escapeHTML(data.username)+"</b><br>"+
"<span class='small'>Chat shuru karein →</span>";

div.onclick=()=>openChat(data);

result.appendChild(div);

});

};


/* FIRESTORE SAFE QUERY */

async function getDocsSafe(q){

const {getDocs} =
await import(
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
);

return await getDocs(q);

}


/* OPEN CHAT */

window.openChat=function(user){

currentChatUser=user;

document.getElementById("homeScreen")
.classList.add("hidden");

document.getElementById("chatScreen")
.style.display="flex";

document.getElementById("chatUser").innerText =
"👤 "+user.username;

loadMessages();

};


/* ROOM ID */

function getRoomId(){

const ids=[
currentUser.uid,
currentChatUser.uid
];

ids.sort();

return ids[0]+"_"+ids[1];

}


/* LOAD REAL-TIME MESSAGES */

function loadMessages(){

const roomId=getRoomId();

const q=
query(
collection(db,"messages"),
where("roomId","==",roomId)
);

if(unsubscribeMessages)
unsubscribeMessages();

unsubscribeMessages=
onSnapshot(q,(snapshot)=>{

const box=
document.getElementById("messages");

box.innerHTML="";

let list=[];

snapshot.forEach((d)=>{

list.push(d.data());

});

list.sort((a,b)=>{

const aTime =
a.createdAt?.seconds || 0;

const bTime =
b.createdAt?.seconds || 0;

return aTime-bTime;

});

list.forEach((m)=>{

const div=document.createElement("div");

div.className =
"msg "+
(m.senderId===currentUser.uid
?"sent":"received");

div.innerText=m.text;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});

}


/* SEND MESSAGE */

window.sendMessage=async function(){

const input=
document.getElementById("messageInput");

const text=input.value.trim();

if(!text || !currentChatUser)
return;

await addDoc(
collection(db,"messages"),
{
roomId:getRoomId(),
senderId:currentUser.uid,
receiverId:currentChatUser.uid,
text:text,
createdAt:serverTimestamp()
}
);

input.value="";

};


/* ENTER SEND */

window.enterSend=function(event){

if(event.key==="Enter"){
sendMessage();
}

};


/* CLOSE CHAT */

window.closeChat=function(){

if(unsubscribeMessages)
unsubscribeMessages();

document.getElementById("chatScreen")
.style.display="none";

document.getElementById("homeScreen")
.classList.remove("hidden");

};


/* HTML SECURITY */

function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
  </html>
