<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DRCHAT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

html,body{
width:100%;
height:100%;
background:#eee;
}

.app{
width:100%;
max-width:500px;
height:100vh;
margin:auto;
background:#fff;
display:flex;
flex-direction:column;
overflow:hidden;
}

.header{
background:#075e54;
color:white;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:bold;
}

.screen{
flex:1;
overflow:auto;
}

.box{
padding:18px;
}

h2{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
margin:6px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
outline:none;
}

button{
padding:13px 18px;
border:0;
border-radius:8px;
background:#075e54;
color:white;
font-size:16px;
margin:5px 2px;
}

.small{
color:#777;
font-size:14px;
margin:7px 0;
}

.hidden{
display:none!important;
}

.user{
padding:14px;
border-bottom:1px solid #ddd;
cursor:pointer;
}

.chatScreen{
display:none;
flex:1;
flex-direction:column;
min-height:0;
}

.chatHeader{
background:#075e54;
color:white;
padding:13px;
display:flex;
align-items:center;
}

.back{
font-size:28px;
margin-right:15px;
cursor:pointer;
}

.messages{
flex:1;
min-height:0;
padding:12px;
overflow-y:auto;
background:#efeae2;
}

.msg{
max-width:75%;
padding:9px 12px;
margin:6px 0;
border-radius:10px;
word-wrap:break-word;
font-size:16px;
}

.sent{
background:#d9fdd3;
margin-left:auto;
}

.received{
background:white;
margin-right:auto;
}

.messageBox{
display:flex;
align-items:center;
padding:7px;
background:#eee;
}

.messageBox input{
margin:0;
flex:1;
border-radius:25px;
}

.send{
width:52px;
height:48px;
padding:0;
border-radius:50%;
margin-left:6px;
font-size:22px;
}

#status{
display:none;
padding:8px;
font-size:13px;
text-align:center;
background:#fff3cd;
color:#664d03;
}
</style>
</head>

<body>

<div class="app">

<!-- LOGIN -->
<div id="loginScreen" class="screen">

<div class="header">
<div class="logo">DRCHAT</div>
</div>

<div class="box">

<h2>DRCHAT Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">Login</button>

<button onclick="signup()">Create Account</button>

<p id="loginMsg" class="small"></p>

</div>
</div>


<!-- HOME -->
<div id="homeScreen" class="screen hidden">

<div class="header">

<div class="logo">DRCHAT</div>

<button onclick="logout()">Logout</button>

</div>

<div class="box">

<h3 id="myName">DRCHAT</h3>

<p class="small">
Username se user search karo
</p>

<input
id="searchUser"
placeholder="Username likho">

<button onclick="searchUser()">Search</button>

<div id="searchResult"></div>

</div>

</div>


<!-- CHAT -->
<div id="chatScreen" class="chatScreen">

<div class="chatHeader">

<div
class="back"
onclick="closeChat()">←</div>

<div id="chatUser">Chat</div>

</div>

<div id="status"></div>

<div
id="messages"
class="messages">
</div>

<div class="messageBox">

<input
id="messageInput"
placeholder="Message likho..."
onkeydown="enterSend(event)">

<button
class="send"
onclick="sendMessage()">➤</button>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
getDocs,
collection,
addDoc,
query,
where,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyAckXOKvjKJi_Idim6Xja29h-WMpjdTXHs",

authDomain:"drchat-5cfbf.firebaseapp.com",

projectId:"drchat-5cfbf",

storageBucket:"drchat-5cfbf.firebasestorage.app",

messagingSenderId:"905952296260",

appId:"1:905952296260:web:0cf8eed8be7284f0d76b11",

measurementId:"G-9J7ZPXXBWS"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let currentUser = null;

let currentChatUser = null;

let unsubscribeMessages = null;


/* MESSAGE STATUS */

function showStatus(text){

const box=document.getElementById("status");

box.innerText=text;

box.style.display="block";

setTimeout(()=>{

box.style.display="none";

},4000);

}


/* SIGN UP */

window.signup=async function(){

const email=document
.getElementById("email")
.value.trim();

const password=document
.getElementById("password")
.value;

if(!email){

alert("Email bharo");

return;

}

if(password.length<6){

alert("Password kam se kam 6 characters ka hona chahiye");

return;

}

try{

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

let username=prompt(
"Apna unique username likho:"
);

if(!username){

alert("Username zaroor likho");

await signOut(auth);

return;

}

username=username
.trim()
.toLowerCase()
.replace(/\s+/g,"");

if(!username){

alert("Valid username likho");

await signOut(auth);

return;

}


/* USERNAME UNIQUE CHECK */

const usernameQuery=query(
collection(db,"users"),
where("username","==",username)
);

const usernameSnap=
await getDocs(usernameQuery);

if(!usernameSnap.empty){

alert("Ye username already use ho raha hai");

await signOut(auth);

return;

}


/* USER SAVE */

await setDoc(
doc(db,"users",result.user.uid),
{
uid:result.user.uid,
email:email,
username:username,
createdAt:serverTimestamp()
}
);

alert("Account successfully ban gaya!");

}catch(error){

alert(
"Account error: "+
error.message
);

}

};


/* LOGIN */

window.login=async function(){

const email=document
.getElementById("email")
.value.trim();

const password=document
.getElementById("password")
.value;

if(!email||!password){

alert("Email aur password bharo");

return;

}

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

alert(
"Login error: "+
error.message
);

}

};


/* LOGOUT */

window.logout=async function(){

try{

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}

await signOut(auth);

}catch(error){

alert(error.message);

}

};


/* AUTH */

onAuthStateChanged(
auth,
async(user)=>{

if(user){

currentUser=user;

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("homeScreen")
.classList.remove("hidden");

try{

const snap=
await getDoc(
doc(db,"users",user.uid)
);

if(snap.exists()){

document
.getElementById("myName")
.innerText=
"👤 "+snap.data().username;

}

}catch(error){

alert(
"User data error: "+
error.message
);

}

}else{

currentUser=null;

document
.getElementById("loginScreen")
.classList.remove("hidden");

document
.getElementById("homeScreen")
.classList.add("hidden");

document
.getElementById("chatScreen")
.style.display="none";

}

}
);


/* SEARCH */

window.searchUser=async function(){

if(!currentUser){

alert("Pehle login karo");

return;

}

const username=document
.getElementById("searchUser")
.value
.trim()
.toLowerCase()
.replace(/\s+/g,"");

if(!username){

alert("Username likho");

return;

}

const result=
document.getElementById("searchResult");

result.innerHTML=
"<p class='small'>Searching...</p>";

try{

const q=query(
collection(db,"users"),
where("username","==",username)
);

const snap=await getDocs(q);

result.innerHTML="";

if(snap.empty){

result.innerHTML=
"<p class='small'>User nahi mila.</p>";

return;

}

snap.forEach((d)=>{

const data=d.data();

if(data.uid===currentUser.uid){

result.innerHTML=
"<p class='small'>Ye aapka khud ka username hai.</p>";

return;

}

const div=document.createElement("div");

div.className="user";

div.innerHTML=
"<b>👤 "+
escapeHTML(data.username)+
"</b><br>"+
"<span class='small'>Chat shuru karein →</span>";

div.onclick=function(){

openChat(data);

};

result.appendChild(div);

});

}catch(error){

result.innerHTML=
"<p class='small'>Search error: "+
escapeHTML(error.message)+
"</p>";

}

};


/* OPEN CHAT */

window.openChat=function(user){

if(!currentUser){

alert("Pehle login karo");

return;

}

currentChatUser=user;

document
.getElementById("homeScreen")
.classList.add("hidden");

document
.getElementById("chatScreen")
.style.display="flex";

document
.getElementById("chatUser")
.innerText=
"👤 "+user.username;

document
.getElementById("messages")
.innerHTML=
"<p class='small'>Messages loading...</p>";

loadMessages();

};


/* ROOM */

function getRoomId(){

const ids=[
currentUser.uid,
currentChatUser.uid
];

ids.sort();

return ids[0]+"_"+ids[1];

}


/* LOAD MESSAGES */

function loadMessages(){

if(!currentUser||!currentChatUser){

return;

}

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}

const roomId=getRoomId();

const q=query(
collection(db,"messages"),
where("roomId","==",roomId)
);

unsubscribeMessages=
onSnapshot(
q,
(snapshot)=>{

const box=
document.getElementById("messages");

box.innerHTML="";

let messages=[];

snapshot.forEach((d)=>{

const data=d.data();

messages.push({
id:d.id,
...data
});

});


messages.sort(
(a,b)=>{

const aTime=
a.createdAt?.seconds||0;

const bTime=
b.createdAt?.seconds||0;

return aTime-bTime;

});


messages.forEach((m)=>{

const div=
document.createElement("div");

div.className=
"msg "+
(
m.senderId===currentUser.uid
?"sent"
:"received"
);

div.innerText=m.text||"";

box.appendChild(div);

});

box.scrollTop=
box.scrollHeight;

},
(error)=>{

document
.getElementById("messages")
.innerHTML=
"<p class='small'>Message load error: "+
escapeHTML(error.message)+
"</p>";

}

);

}


/* SEND MESSAGE */

window.sendMessage=async function(){

if(!currentUser){

alert("Login nahi hai");

return;

}

if(!currentChatUser){

alert("User select karo");

return;

}

const input=
document.getElementById("messageInput");

const text=input.value.trim();

if(!text){

return;

}

const roomId=getRoomId();

try{

/*
Temporary local message display
*/

const box=
document.getElementById("messages");

const temp=
document.createElement("div");

temp.className="msg sent";

temp.innerText=text;

box.appendChild(temp);

box.scrollTop=
box.scrollHeight;


/*
Firebase save
*/

await addDoc(
collection(db,"messages"),
{
roomId:roomId,

senderId:currentUser.uid,

receiverId:currentChatUser.uid,

text:text,

createdAt:serverTimestamp()
}
);

input.value="";

}catch(error){

/*
Remove temporary message
*/

if(boxContainsTemp(text)){

removeLastTempMessage();

}

alert(
"Message send nahi hua.\n\nFirebase error:\n"+
error.message
);

}

};


/* TEMP MESSAGE HELPERS */

function boxContainsTemp(text){

const box=
document.getElementById("messages");

const items=
box.querySelectorAll(".msg.sent");

if(!items.length)return false;

return items[items.length-1].innerText===text;

}

function removeLastTempMessage(){

const box=
document.getElementById("messages");

const items=
box.querySelectorAll(".msg.sent");

if(items.length){

items[items.length-1].remove();

}

}


/* ENTER */

window.enterSend=function(event){

if(event.key==="Enter"){

event.preventDefault();

sendMessage();

}

};


/* CLOSE CHAT */

window.closeChat=function(){

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}

document
.getElementById("chatScreen")
.style.display="none";

document
.getElementById("homeScreen")
.classList.remove("hidden");

document
.getElementById("messageInput")
.value="";

};


/* SECURITY */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
